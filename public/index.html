          </span>
          <input type="text" id="urlInput" placeholder="Paste link here..." autocomplete="off" />

            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">

              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
        </div>
        <button id="downloadBtn">Analyze</button>
      </div>

      <div id="loader" class="hidden">
        <div class="skeleton-card">
          <div class="skeleton-thumb"></div>
          <div class="skeleton-info">
            <div class="skeleton-line title"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
          </div>
        </div>
        <p id="loaderText">Analyzing link...</p>
        <div class="progress-container hidden" id="progressContainer">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <div id="resultSection" class="hidden">
        <div class="media-card">
          <button id="closeResult" class="close-card">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
          <div class="thumbnail-wrapper" id="previewContainer">
            <div id="slidesWrapper"></div>
            <div class="slider-nav hidden" id="sliderNav">

                </svg>
              </button>
            </div>
          </div>
          <div class="info-wrapper">
            <h2 id="resultTitle">Content</h2>
            <div id="downloadList" class="download-options"></div>
          </div>
        </div>
      </div>
